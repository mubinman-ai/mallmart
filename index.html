<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>handmade Accessories</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#0a0a0a;--mut:#5b6472;--line:#e3e7ee;--blue:#1d4ed8;--soft:#eef3ff;--on:#fff;--ok:#0a7d3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--fg:#f4f6fa;--mut:#9aa4b5;--line:#232a38;--blue:#6b95ff;--soft:#172037;--on:#0d1017;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#0d1017;--fg:#f4f6fa;--mut:#9aa4b5;--line:#232a38;--blue:#6b95ff;--soft:#172037;--on:#0d1017;--ok:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{line-height:1.15;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:430px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
nav{display:flex;align-items:center;gap:20px;height:64px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.03em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{background:var(--blue);color:var(--on);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:16px}
.links{display:flex;gap:18px;margin-left:auto;overflow-x:auto}
.links a{text-decoration:none;color:var(--mut);font-weight:600;font-size:14px;white-space:nowrap}
.links a:hover,.links a.on{color:var(--fg)}
.cartb{background:var(--blue);color:var(--on);border:0;border-radius:999px;padding:8px 14px;font-weight:700}
.btn{background:var(--blue);color:var(--on);border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn.alt{background:var(--soft);color:var(--blue)}
.btn.line{background:none;border:1px solid var(--line);color:var(--fg)}
.hero{background:var(--soft);border-radius:20px;margin:24px 0;padding:56px 36px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.hero h1{font-size:clamp(34px,6vw,60px);letter-spacing:-.04em}
.hero p{color:var(--mut);font-size:18px;max-width:420px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:54px;text-align:center}
.tiles span{background:var(--bg);border-radius:16px;padding:20px 0}
section{margin:44px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:170px;display:grid;place-items:center;font-size:72px;background:var(--soft);position:relative}
.off{position:absolute;top:10px;left:10px;background:var(--blue);color:var(--on);font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}
.card div.b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card p{margin:0;color:var(--mut);font-size:13px}
.price b{font-size:20px}.price s{color:var(--mut);margin-left:6px;font-size:14px}
.stars{color:#f5a623;font-size:14px}
.row{display:flex;gap:8px;margin-top:auto}.row .btn{flex:1;padding:9px 6px;font-size:13px}
.banners{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.banner{border-radius:16px;padding:28px;background:var(--fg);color:var(--bg)}
.banner.b2{background:var(--blue);color:var(--on)}
.rev{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.rev blockquote{margin:0;border-left:3px solid var(--blue);padding:4px 14px;color:var(--mut)}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:14px;margin-top:60px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px}
.tw{overflow-x:auto}
.line-item{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line-item .e{font-size:36px;background:var(--soft);border-radius:10px;width:60px;height:60px;display:grid;place-items:center}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--fg)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:28px}
form label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.sum{border:1px solid var(--line);border-radius:14px;padding:18px;align-self:start}
.sum div{display:flex;justify-content:space-between;margin:6px 0}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--blue)}
.upi{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.upi label{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:6px;align-items:center;margin:0;font-weight:600}.upi input{width:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px;z-index:20}
.modal>div{background:var(--bg);border-radius:16px;padding:24px;max-width:420px;width:100%}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--mut);margin:12px 0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:30}
@media(min-width:0px){.hero,.two,.banners{grid-template-columns:1fr}.hero{padding:32px 22px}.links{gap:12px}nav{gap:10px}}
.pic,.line-item .e{overflow:hidden}.pic{height:auto;aspect-ratio:1/1}.tiles span{padding:0;aspect-ratio:1;overflow:hidden}nav{flex-wrap:wrap;height:auto;padding:8px 0}.links{order:3;width:100%;margin-left:0;min-width:0}.logo{white-space:nowrap}.cartb{margin-left:auto}</style></head>

const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let prods=ld("mm_p2",P0),cart=ld("mm_c",[]),orders=ld("mm_o",[]),admin=false,pay="Google Pay";
const inr=n=>"₹"+n.toLocaleString("en-IN");
const $=s=>document.querySelector(s);
const off=p=>Math.round((1-p.p/p.o)*100);
const st=r=>"★".repeat(Math.round(r))+"☆".repeat(5-Math.round(r))+" "+r;
function toast(t){const x=document.createElement("div");x.className="toast";x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),1800)}
function go(v){location.hash=v}
function add(id,buy){const i=cart.find(x=>x.id==id);i?i.q++:cart.push({id,q:1});sv("mm_c",cart);buy?go("checkout"):toast("Added to cart");upd()}
function upd(){$("#cc").textContent=cart.reduce((a,x)=>a+x.q,0)}
function qty(id,d){const i=cart.find(x=>x.id==id);i.q+=d;if(i.q<1)cart=cart.filter(x=>x.id!=id);sv("mm_c",cart);upd();view()}
function rm(id){cart=cart.filter(x=>x.id!=id);sv("mm_c",cart);upd();view()}
const items=()=>cart.map(x=>({...prods.find(p=>p.id==x.id),q:x.q})).filter(x=>x.n);
const tot=()=>items().reduce((a,x)=>a+x.p*x.q,0);
const im=p=>p.img?`<img src="${p.img}" alt="${p.n}" style="width:100%;height:100%;object-fit:cover">`:p.e;
const card=p=>`<div class="card"><div class="pic"><span class="off">${off(p)}% off</span>${im(p)}</div><div class="b"><h3 style="font-size:16px">${p.n}</h3><span class="stars">${st(p.r)}</span><p>${p.d}</p><div class="price"><b>${inr(p.p)}</b><s>${inr(p.o)}</s></div><div class="row"><button class="btn alt" onclick="add(${p.id})">Add to Cart</button><button class="btn" onclick="add(${p.id},1)">Buy Now</button></div></div></div>`;
const V={
home:()=>`<div class="hero"><div><h1>Welcome to handmade Accessories</h1><p>Your Everyday Shopping Destination</p><button class="btn" onclick="go('shop')">Shop Now</button></div><div class="tiles">${prods.slice(0,4).map(p=>`<span>${im(p)}</span>`).join("")}</div></div>
<section><h2>Featured products</h2><br><div class="grid">${prods.slice(0,3).map(card).join("")}</div></section>
<section><h2>Best sellers</h2><br><div class="grid">${[...prods].sort((a,b)=>b.r-a.r).slice(0,3).map(card).join("")}</div></section>
<section class="banners"><div class="banner"><h2>Up to 45% off</h2><p>On headphones, watches and more.</p></div><div class="banner b2"><h2>Pay with UPI</h2><p>Google Pay, PhonePe or Paytm. Fast and secure.</p></div></section>
<section><h2>What customers say</h2><br><div class="rev"><blockquote>Fast delivery and the headphones sound great. — Aarav, Vadodara</blockquote><blockquote>Paid by UPI in seconds. Easy checkout. — Priya, Surat</blockquote><blockquote>The backpack is sturdy and worth the price. — Rohan, Pune</blockquote></div></section>`,
shop:()=>`<section><h2>Shop</h2><br><div class="grid">${prods.map(card).join("")||"No products yet."}</div></section>`,
categories:()=>`<section><h2>Categories</h2><br>${[...new Set(prods.map(p=>p.c))].map(c=>`<h3 style="margin:18px 0 10px">${c}</h3><div class="grid">${prods.filter(p=>p.c==c).map(card).join("")}</div>`).join("")}</section>`,
contact:()=>`<section><h2>Contact Us</h2><p>Email mubinman8@gmail.com. We reply within one working day.</p></section>`,
cart:()=>{const it=items();return `<section><h2>Your cart</h2>${it.length?it.map(x=>`<div class="line-item"><div class="e">${im(x)}</div><div style="flex:1"><b>${x.n}</b><br>${inr(x.p)}</div><div class="qty"><button onclick="qty(${x.id},-1)" aria-label="Decrease">−</button>${x.q}<button onclick="qty(${x.id},1)" aria-label="Increase">+</button></div><b>${inr(x.p*x.q)}</b><button class="btn line" onclick="rm(${x.id})">Remove</button></div>`).join("")+`<p style="text-align:right;font-size:20px">Subtotal <b>${inr(tot())}</b></p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn line" onclick="go('shop')">Continue Shopping</button><button class="btn" onclick="go('checkout')">Proceed to Checkout</button></div>`:`<p>Your cart is empty.</p><button class="btn" onclick="go('shop')">Start shopping</button>`}</section>`},
checkout:()=>{const it=items();if(!it.length)return V.cart();return `<section><h2>Checkout</h2><br><div class="two"><form id="f" onsubmit="return pre(event)"><label>Full name<input name="name" required></label><label>Email address<input name="email" type="email" required></label><label>Mobile number<input name="phone" required pattern="[6-9][0-9]{9}" title="10-digit Indian mobile number"></label><label>Complete shipping address<input name="addr" required></label><label>City<input name="city" required></label><label>State<input name="state" required></label><label>PIN code<input name="pin" required pattern="[0-9]{6}" title="6-digit PIN code"></label><h3 style="margin-top:20px">Payment method</h3><div class="upi">${["Google Pay","PhonePe","Paytm"].map(a=>`<label><input type="radio" name="app" ${a==pay?"checked":""} onchange="pay='${a}'">${a}</label>`).join("")}</div><button class="btn" style="width:100%">Pay ${inr(tot())} with UPI</button></form><div class="sum"><h3>Order summary</h3>${it.map(x=>`<div><span>${x.n} × ${x.q}</span><span>${inr(x.p*x.q)}</span></div>`).join("")}<div style="border-top:1px solid var(--line);padding-top:8px"><b>Total</b><b>${inr(tot())}</b></div><div class="note">UPI only. No cash on delivery.</div></div></div></section>`},
orders:()=>`<section><h2>My Orders</h2>${orders.length?`<div class="tw"><table><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th></tr>${orders.map(o=>`<tr><td>${o.id}</td><td>${o.t}</td><td>${o.it.map(i=>i.n+" ×"+i.q).join(", ")}</td><td>${inr(o.total)}</td><td><span class="pill">${o.s}</span></td></tr>`).join("")}</table></div>`:"<p>No orders yet.</p>"}</section>`,
admin:()=>{if(!admin)return `<section style="max-width:340px"><h2>Admin login</h2><form onsubmit="return login(event)"><label>Password<input type="password" name="pw" required></label><br><button class="btn">Log in</button></form><div class="note">Prototype only. The real version uses Supabase Auth.</div></section>`;
const S=["Payment Pending","Payment Successful","Processing","Shipped","Delivered"],paid=orders.filter(o=>o.s!="Payment Pending");
return `<section><h2>Admin dashboard</h2><br><div class="grid"><div class="card"><div class="b"><p>Total sales</p><h2>${inr(paid.reduce((a,o)=>a+o.total,0))}</h2></div></div><div class="card"><div class="b"><p>Total orders</p><h2>${orders.length}</h2></div></div></div>
<h3 style="margin:28px 0 8px">Orders</h3><div class="tw"><table><tr><th>Order</th><th>Customer</th><th>Contact</th><th>Address</th><th>Total</th><th>Txn ID</th><th>Status</th></tr>${orders.map(o=>`<tr><td>${o.id}</td><td>${o.c.name}</td><td>${o.c.email}<br>${o.c.phone}</td><td>${o.c.addr}, ${o.c.city}, ${o.c.state} ${o.c.pin}</td><td>${inr(o.total)}</td><td>${o.tx}</td><td><select onchange="setS('${o.id}',this.value)">${S.map(s=>`<option ${s==o.s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")||"<tr><td colspan=7>No orders yet.</td></tr>"}</table></div>

<form onsubmit="return addP(event)" style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-top:14px;align-items:end"><label>New product<input name="n" required></label><label>Price<input name="p" type="number" min="1" required></label><label>Original<input name="o" type="number" min="1" required></label><button class="btn">Add product</button></form>

function login(e){e.preventDefault();if(e.target.pw.value=="admin7487"){admin=true;view()}else toast("Wrong password");return false}
function setS(id,s){orders.find(o=>o.id==id).s=s;sv("mm_o",orders);view()}
function setP(id,v){prods.find(p=>p.id==id).p=+v;sv("mm_p2",prods);toast("Price updated")}
function delP(id){prods=prods.filter(p=>p.id!=id);sv("mm_p2",prods);view()}
function addP(e){e.preventDefault();const f=e.target;prods.push({id:Date.now(),n:f.n.value,p:+f.p.value,o:Math.max(+f.o.value,+f.p.value+1),e:"📦",c:"New",r:4,d:"New arrival."});sv("mm_p2",prods);view();return false}
function preOld(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));window._c=f;
const m=document.createElement("div");m.className="modal";m.innerHTML=`<div><h3>Pay ${inr(tot())}</h3><p>Open ${pay} and approve the request.</p><div class="note">Demo mode: this simulates a UPI payment. No real money moves. The live version uses Razorpay and verifies each payment on the server.</div><div style="display:flex;gap:8px"><button class="btn" id="ok">I have paid</button><button class="btn line" id="no">Cancel</button></div></div>`;
document.body.append(m);$("#no").onclick=()=>m.remove();$("#ok").onclick=()=>{m.remove();done()};return false}
function done(){const d=new Date(),id="MM"+d.getFullYear()+Math.floor(Math.random()*9e5+1e5),o={id,t:d.toLocaleString("en-IN"),it:items().map(x=>({n:x.n,q:x.q,p:x.p})),total:tot(),c:window._c,s:"Payment Successful",tx:"DEMO"+Math.random().toString(36).slice(2,10).toUpperCase()};
orders.unshift(o);sv("mm_o",orders);cart=[];sv("mm_c",cart);upd();window._last=o;go("done")}
V.done=()=>{const o=window._last;if(!o)return V.orders();return `<section style="text-align:center;padding:40px 0"><div style="font-size:60px">✅</div><h2>Order confirmed</h2><p>Order ID <b>${o.id}</b> · Transaction ${o.tx}<br>Total paid ${inr(o.total)} · ${o.s}</p><p style="color:var(--mut)">A confirmation email goes to ${o.c.email} in the live version.</p><button class="btn" onclick="go('orders')">View my orders</button></section>`};
async function mail(to,subject,message){if(!EMAILJS.key)return false;try{const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:EMAILJS.service,template_id:EMAILJS.template,user_id:EMAILJS.key,template_params:{to_email:to,subject,message}})});return r.ok}catch(e){return false}}

function utr(e){e.preventDefault();const o=window._last;o.tx=e.target.u.value.trim();sv("mm_o",orders);mail(OWNER_EMAIL,"Payment submitted for "+o.id+": verify UTR "+o.tx,txt(o));mail(o.c.email,"handmade Accessories order "+o.id,"Thank you for your order. We will confirm it once your payment is verified.\n\n"+txt(o));go("done");return false}
V.pay=()=>{const o=window._last;if(!o)return V.orders();setTimeout(()=>{const b=$("#qr");if(!b)return;if(QR_IMAGE_URL){b.innerHTML=`<img src="${QR_IMAGE_URL}" alt="UPI QR code" width="220">`}else if(window.QRCode){b.innerHTML="";new QRCode(b,{text:upiLink(o),width:220,height:220})}else b.textContent="QR could not load. Pay to UPI ID "+UPI_ID},0);return `<section style="max-width:460px;margin:auto;text-align:center"><h2>Pay ${inr(o.total)} by UPI</h2><p>Order ${o.id}. Scan with Google Pay, PhonePe or Paytm.</p><div id="qr" style="display:grid;place-items:center;margin:16px 0;min-height:220px"></div><p>UPI ID: <b>${UPI_ID}</b></p><a class="btn" style="display:inline-block;text-decoration:none" href="${upiLink(o)}">Open UPI app</a><form onsubmit="return utr(event)" style="text-align:left;margin-top:20px"><label>After paying, enter the UTR / transaction ID<input name="u" required minlength="8"></label><br><button class="btn" style="width:100%">Submit payment details</button></form><div class="note">We confirm your order once we see the payment in our bank account.</div></section>`};
V.done=()=>{const o=window._last;if(!o)return V.orders();return `<section style="text-align:center;padding:40px 0"><div style="font-size:60px">✅</div><h2>Order received</h2><p>Order ID <b>${o.id}</b> · UTR ${o.tx}<br>Total ${inr(o.total)} · ${o.s}</p><p style="color:var(--mut)">Your order is confirmed after we verify the payment.</p><button class="btn" onclick="go('orders')">View my orders</button></section>`};
